# mjx-acp-viewer configuration.
#
# Everything here has a working default; the file exists so you can point the
# server at a different workspace or add your own agent.

[server]
# Loopback only. Binding elsewhere requires --i-know-this-is-unauthenticated.
bind = "127.0.0.1:4321"

# How long an agent keeps running with no browser attached, so a reload rejoins
# the session it left rather than starting over. Set it to 0 to turn resuming
# off, and have an agent die with its socket as it used to.
# resume_ttl_secs = 300

[workspace]
# Roots that fs/read_text_file and fs/write_text_file are jailed to, and the
# choices offered as `cwd` in the agent picker. Relative to this file.
roots = ["demo/workspace"]

[registry]
# The ACP agent registry. Fetched once and cached; the catalog still works
# offline from the cache or from the [[agents]] entries below.
url = "https://cdn.agentclientprotocol.com/registry/v1/latest/registry.json"
cache_dir = ".mjx-cache"

# Agents defined here take precedence over the registry entry with the same id.
# Use this to point at an already-installed binary instead of paying npx.

[[agents]]
id = "mock"
name = "Mock Agent"
description = "Scripted agent. No credentials, no network. Exercises every UI surface."
command = "target/debug/mjx-mock-agent"

[[agents]]
id = "kilo"
name = "Kilo"
description = "The open source coding agent."
command = "kilo"
args = ["acp"]

# MCP servers offered to every agent this server starts. `transport` is one of
# stdio (the default), http, sse or acp. Only stdio is mandatory for agents; the
# rest are dropped, with a reason in the sidebar, for an agent that did not
# declare them.
#
# The one below is `acp`: *this server* runs it and the agent reaches it over ACP,
# so its command and environment — and therefore any credential in them — never
# reach the agent. It is the mock agent in its MCP mode, so the demo has an MCP
# server to show with nothing installed.
[[mcp_servers]]
name = "mock-mcp"
transport = "acp"
command = "target/debug/mjx-mock-agent"
args = ["--mcp"]
env = { MJX_MOCK_MCP_TOKEN = "not-a-real-token" }

# A server the *agent* spawns, with its token read from this server's environment
# rather than written here. An `env_from`/`headers_from` variable that is not set
# leaves the server configured but unavailable, and the sidebar says which one.
#
# [[mcp_servers]]
# name = "github"
# transport = "http"
# url = "https://api.githubcopilot.com/mcp/"
# headers_from = { Authorization = "GITHUB_MCP_TOKEN" }

# How agents get their *own* credentials. Distinct from anything above: this is
# the agent authenticating itself to whatever it talks to, not this server
# authenticating anybody.
#
# Order is dispatch order — the first provider that can handle an auth method is
# the one that does. `agents` and `methods` narrow an entry; leaving either out
# means "all of them". An `env_from` variable that is not set leaves the provider
# configured but unavailable, and the auth panel says which one to set.
#
# These credentials are the *operator's*. They come from the environment this
# server was started in and from this file, and every browser attached acts as
# that one operator. Values never travel to the browser — only names and
# reasons. See SECURITY.md.
#
# [[auth_providers]]
# name = "anthropic"
# kind = "env"
# agents = ["claude-acp"]
# env_from = { ANTHROPIC_API_KEY = "ANTHROPIC_API_KEY" }
#
# `terminal` runs the agent's own binary with the arguments the agent asked for,
# in a PTY the browser can type into. It takes no `env` of its own: what runs is
# never this file's choice, and never the browser's.
#
# [[auth_providers]]
# name = "interactive"
# kind = "terminal"

# claude-acp, gemini and codex-acp resolve from the registry:
#
#   claude-acp  npx -y @agentclientprotocol/claude-agent-acp@<pinned>
#   gemini      npx -y @google/gemini-cli@<pinned> --acp
#   codex-acp   npx -y @agentclientprotocol/codex-acp@<pinned>
#
# claude-acp needs no configuration — it reuses the `claude` CLI's own auth.
